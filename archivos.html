<!DOCTYPE html>
<html>
<head>
    <title>Archivos - Blask Store</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 40px;
            background: #f0f0f0;
        }
        h1 { color: #2c3e50; }
        .descripcion { color: #555; margin-bottom: 30px; }
        .enlace {
            display: inline-block;
            width: 80%;
            max-width: 500px;
            margin: 10px auto;
            padding: 15px 20px;
            background: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
            transition: 0.2s;
        }
        .enlace:hover { background: #219653; }

        /* === ESTILOS DEL BLOQUEO === */
        .caja-bloqueo {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 350px;
            margin: 0 auto;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            padding: 12px 30px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover { background: #c0392b; }
        .error { color: red; margin-top: 10px; display: none; }
        .oculto { display: none; }
    </style>
</head>
<body>

    <!-- === PANTALLA DE BLOQUEO (aparece primero) === -->
    <div id="pantalla-bloqueo" class="caja-bloqueo">
        <h2>🔒 Ingresa la Contraseña</h2>
        <p>Para ver las descargas, escribe la contraseña:</p>
        <input type="password" id="pass" placeholder="Escribe aquí...">
        <br>
        <button onclick="verificarPass()">Entrar</button>
        <p id="mensaje-error" class="error">❌ Contraseña incorrecta</p>
    </div>

    <!-- === TUS ENLACES (OCULTOS hasta acertar) === -->
    <div id="contenido-enlaces" class="oculto">
        <h1>📂 Tus Descargas</h1>
        <p class="descripcion">Aquí están todos los enlaces directos:</p>

        <a href="https://www.mediafire.com/file/31zzkrvwaz8t7d3/subnautica_1.21.82792-libreapk.com.apk/file" class="enlace">Subnautica</a>
        <a href="https://www.mediafire.com/file/qz9p2beze5qv6dn/Slime_Rancher.apk/file" class="enlace">Slime Rancher</a>
        <a href="https://www.mediafire.com/file/ju9w6zcjcx1tfpn/Hollow_Knight_%25283%2529.apk/file" class="enlace">Hollow Knight</a>
        <a href="https://www.mediafire.com/file/kcf5kt4caz7o5lx/Daily_Lives_of_My_Countryside_Nekobot_com.nekobot.webview.nekobot_3.4.3_V1.apk/file" class="enlace">🏡 Daily Lives of My Countryside</a>
    </div>

<script>
    // === TU CONTRASEÑA DE ACCESO ===
    const CONTRASENA = "admin"; // Cámbiala por la que tú quieras

    function verificarPass() {
        let escrita = document.getElementById('pass').value;
        let error = document.getElementById('mensaje-error');

        if(escrita === CONTRASENA) {
            // ✅ Correcta: muestra los enlaces
            document.getElementById('pantalla-bloqueo').classList.add('oculto');
            document.getElementById('contenido-enlaces').classList.remove('oculto');
        } else {
            // ❌ Incorrecta: muestra error y no deja ver nada
            error.style.display = "block";
            document.getElementById('pass').value = "";
        }
    }
</script>

</body>
</html>
