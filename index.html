<!DOCTYPE html>
<html>
<head>
    <title>blask store</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding-top: 50px;
            background: #f0f0f0;
        }
        h1 { color: #2c3e50; }
        .boton {
            display: inline-block;
            padding: 15px 30px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }
        .boton:hover { background: #2980b9; }
        .espera {
            color: red;
            font-size: 22px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>¡Bienvenidos a blask store!</h1>
    <p>Página web creada por user.</p>
    <p>Espera unos segundos para continuar...</p>
    <p class="espera" id="contador">5</p>

    <script>
        // Cuenta regresiva de 5 segundos y redirige automáticamente
        let tiempo = 5;
        let contador = document.getElementById('contador');
        
        let cuenta = setInterval(function() {
            tiempo--;
            contador.textContent = tiempo;
            
            if(tiempo <= 0) {
                clearInterval(cuenta);
                window.location.href = "archivos.html";
            }
        }, 1000);
    </script>

    <br><br>
    <a href="archivos.html" class="boton">Ir ahora</a>
</body>
</html>
