<!DOCTYPE html>
<html>
<head>
    <title>Blask Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 80px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(52, 152, 219, 0.6);
        }
        p {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 10px;
        }
        .espera {
            font-size: 48px;
            font-weight: bold;
            color: #00ff88;
            margin: 30px 0;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        .boton {
            display: inline-block;
            padding: 16px 40px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }
        .boton:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
            background: linear-gradient(135deg, #2980b9, #1f618d);
        }
        .barra {
            width: 220px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            margin: 0 auto;
            overflow: hidden;
        }
        .progreso {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border-radius: 4px;
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <h1>¡Blask Store!</h1>
    <p>Página web creada por user.</p>
    <p>Preparando todo... serás redirigido en:</p>

    <div class="espera" id="contador">5</div>
    <div class="barra">
        <div class="progreso" id="barra-progreso"></div>
    </div>

    <br><br>
    <a href="archivos.html" class="boton">▶ Ir ahora</a>

<script>
    // ⏱️ Cuenta regresiva + barra de progreso
    let tiempo = 10;
    let contador = document.getElementById('contador');
    let barra = document.getElementById('barra-progreso');
    let total = tiempo;

    let cuenta = setInterval(function() {
        tiempo--;
        contador.textContent = tiempo;
        
        // Barra que se llena
        let porcentaje = ((total - tiempo) / total) * 100;
        barra.style.width = porcentaje + '%';

        if(tiempo <= 0) {
            clearInterval(cuenta);
            // ✅ Redirige automáticamente
            window.location.href = "archivos.html";
        }
    }, 1000);
</script>

</body>
</html>
