<!DOCTYPE html>
<html>
<head>
    <title>🔴 PÁGINA VULNERABLE - Para Práctica</title>
    <style>
        body {
            font-family: Arial;
            background: #2b0000;
            color: white;
            text-align: center;
            padding-top: 50px;
        }
        .caja {
            background: #4d0000;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            max-width: 380px;
            margin: 0 auto;
            border: 2px solid #ff4444;
        }
        h2 { color: #ff6666; margin-bottom: 20px; }
        .etiqueta { color: #ffaaaa; font-size: 14px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ff4444;
            border-radius: 6px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            background: #660000;
            color: white;
        }
        button {
            padding: 12px 30px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }
        button:hover { background: #cc0000; }
        .mensaje { margin-top: 15px; font-size: 16px; }
        .correcto { color: #00ff00; }
        .incorrecto { color: #ff8888; }
        .aviso { color: #ffcc00; font-size: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="caja">
        <h2>🔴 VERIFICACIÓN DE CÓDIGO</h2>
        <p class="etiqueta">Escribe el código de 4 dígitos enviado a tu correo:</p>
        
        <input type="text" id="codigo" placeholder="____" maxlength="4">
        <br>
        <button onclick="verificar()">Enviar Código</button>
        
        <div id="mensaje" class="mensaje"></div>
        <p class="aviso">⚠️ Página con VULNERABILIDADES — Solo para práctica</p>
    </div>

<script>
    // ==============================================
    // ⚠️ ESTA PÁGINA TIENE FALLOS A PROPÓSITO
    // ==============================================
    // 🔴 FALLO 1: El código se compara LETRA POR LETRA y se nota en el tiempo
    // 🔴 FALLO 2: SIN límite de intentos — puedes probar miles de veces
    // 🔴 FALLO 3: Si aciertas los primeros dígitos, tarda MÁS en responder
    // 🔴 FALLO 4: El código empieza siempre con "1" → pista para adivinarlo

    // Código secreto (CAMBIALO POR EL QUE TÚ QUIERAS)
    const CODIGO_SECRETO = "1847"; // ⚠️ EMPIEZA CON "1" — pista intencional

    function verificar() {
        let intento = document.getElementById('codigo').value;
        let mensaje = document.getElementById('mensaje');

        // 🔴 AQUÍ ESTÁ EL FALLO GRAVE: compara dígito por dígito uno tras otro
        // Cuantos más aciertes, MÁS tarda en responder → se puede MEDIR
        compararPasoAPaso(intento, 0);
    }

    function compararPasoAPaso(codigoIngresado, posicion) {
        // ⏱️ RETRASO QUE AUMENTA SI ACIERTAS MÁS DÍGITOS
        let retraso = 300 + (posicion * 350); // 0.3s, 0.65s, 1.0s, 1.35s...

        setTimeout(() => {
            // Si el dígito actual es CORRECTO → sigue comparando
            if (codigoIngresado[posicion] === CODIGO_SECRETO[posicion]) {
                if (posicion + 1 >= CODIGO_SECRETO.length) {
                    // ✅ TODOS los dígitos correctos → ACCESO CONCEDIDO
                    mensaje.innerHTML = "<span class='correcto'>✅ ¡CÓDIGO CORRECTO! Entrando...</span>";
                    setTimeout(() => { alert("🔓 ACCESO CONCEDIDO"); }, 500);
                    return;
                }
                // Sigue con el siguiente dígito
                compararPasoAPaso(codigoIngresado, posicion + 1);
            } else {
                // ❌ Falló en esta posición → se detiene RÁPIDO
                mensaje.innerHTML = "<span class='incorrecto'>❌ CÓDIGO INCORRECTO — Inténtalo de nuevo</span>";
            }
        }, retraso);
    }

    // 💡 EL MINI-EXPLOIT:
    // Como el tiempo aumenta con cada dígito correcto, 
    // puedes adivinarlo UNO POR UNO midiendo cuánto tarda
    // Ejemplo:
    // Pruebas "1xxx" → tarda MÁS → el primer dígito es "1" ✅
    // Luego "18xx" → tarda MÁS → el segundo es "8" ✅
    // Luego "184x" → tarda MÁS → el tercero es "4" ✅
    // Luego "1847" → ACCESO ✅
</script>

</body>
</html>
